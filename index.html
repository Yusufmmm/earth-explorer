<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;

  color:#fff;

}

button,input{font:inherit}
button{cursor:pointer}

#globe{
  position:fixed;
  inset:0;
  z-index:1;
}

.glass{
  background:rgba(5,14,31,.9);
  border:1px solid rgba(255,255,255,.18);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  box-shadow:0 15px 40px rgba(0,0,0,.4);
}

#topbar{
  position:fixed;
  z-index:20;
  top:14px;
  left:50%;
  transform:translateX(-50%);
  width:min(760px,94vw);
  display:flex;
  gap:8px;
}

#searchWrap{
  position:relative;
  flex:1;
}

#search{
  width:100%;
  padding:13px 15px;
  border-radius:15px;
  border:1px solid rgba(255,255,255,.2);
  outline:none;
  color:#fff;
  background:rgba(5,14,31,.94);
}

#results{
  display:none;
  position:absolute;
  top:52px;
  left:0;
  right:0;
  max-height:290px;
  overflow:auto;
  border-radius:15px;

}

.result{

}

.result:hover{

}

.result img{
  width:34px;
  height:22px;
  object-fit:cover;
  border-radius:4px;
}

.bar{
  position:fixed;
  z-index:18;

#tierBar{top:70px}

}

.bar button.active{

}

#panel{

function setTier(value){
  tier=value;

  document.querySelectorAll(".tier").forEach(btn=>{
    btn.classList.toggle("active",btn.dataset.tier===value);
  });

  $("tierName").textContent=tiers[value].name;

function requireFeature(feature){

  $("upgradeModal").style.display="flex";

/* =========================
   الكرة الأرضية
========================= */

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  45,
  innerWidth/innerHeight,
  0.1,
  1000
);

camera.position.set(0,0,3.1);

const renderer = new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));

$("globe").appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(
  camera,
  renderer.domElement
);

controls.enableDamping=true;
controls.dampingFactor=.05;
controls.minDistance=1.4;
controls.maxDistance=6;
controls.autoRotate=true;
controls.autoRotateSpeed=.25;

scene.add(new THREE.AmbientLight(0xffffff,.72));

const sun = new THREE.DirectionalLight(0xffffff,1.25);
sun.position.set(5,3,5);
scene.add(sun);

const world = new THREE.Group();
scene.add(world);

const textureLoader = new THREE.TextureLoader();

const earth = new THREE.Mesh(
  new THREE.SphereGeometry(1,64,64),
  new THREE.MeshPhongMaterial({
    map:textureLoader.load(
      "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_atmos_2048.jpg"
    ),
    bumpMap:textureLoader.load(
      "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_normal_2048.jpg"
    ),
    bumpScale:.035,
    specularMap:textureLoader.load(
      "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_specular_2048.jpg"
    ),
    specular:new THREE.Color(0x333333)
  })
);

world.add(earth);

const markers = new THREE.Group();
world.add(markers);

function latLon(lat,lon,radius=1.025){

  const phi=(90-lat)*Math.PI/180;
  const theta=(lon+180)*Math.PI/180;

  return new THREE.Vector3(
    -radius*Math.sin(phi)*Math.cos(theta),
    radius*Math.cos(phi),
    radius*Math.sin(phi)*Math.sin(theta)
  );
}

function clearMarkers(){

  while(markers.children.length){

    const child=markers.children[0];

    markers.remove(child);

    if(child.geometry) child.geometry.dispose();
    if(child.material) child.material.dispose();
  }
}

function addMarker(lat,lon,color=0xffd542){

  const marker = new THREE.Mesh(
    new THREE.SphereGeometry(.025,16,16),
    new THREE.MeshBasicMaterial({color})
  );

  marker.position.copy(
    latLon(lat,lon)
  );

  markers.add(marker);
}

function flyTo(lat,lon){

  controls.autoRotate=false;

  cameraMove={
    from:camera.position.clone(),
    to:latLon(lat,lon,2.05),
    start:performance.now(),
    duration:1200
  };
}

let countries=[...baseCountries];

/* تحميل باقي دول العالم */

async function loadCountries(){

  try{

    const response=await fetch(
      "https://restcountries.com/v3.1/all?fields=name,translations,cca2,capital,region,population,area,languages,currencies,flags,latlng"
    );

    if(!response.ok){
      throw new Error("API");
    }

    const data=await response.json();

    const existing=
      new Set(baseCountries.map(x=>x.english));

    const extra=data
    .filter(c=>
      c.latlng &&
      c.latlng.length>=2 &&
      !existing.has(c.name.common)
    )
    .map(c=>{

      const ar=
        c.translations?.ara?.common ||
        c.name.common;

      return{
        name:ar,
        english:c.name.common,
        code:(c.cca2||"").toLowerCase(),
        lat:c.latlng[0],
        lon:c.latlng[1],
        capital:c.capital?.[0]||"—",
        region:c.region||"—",
        population:c.population||0,
        area:c.area||0,
        language:Object.values(c.languages||{}).join("، ")||"—",
        currency:Object.values(c.currencies||{})
          .map(x=>x.name)
          .join("، ")||"—",
        flag:c.flags?.svg||c.flags?.png||"",
        overview:"معلومات عامة عن "+ar+".",
        history:"سيتم توسيع التاريخ بمحتوى موثق.",
        places:"سيتم إضافة أهم المعالم.",
        culture:"سيتم إضافة محتوى ثقافي موسع.",
        edu:"المحتوى التعليمي الكامل متاح للخطط التعليمية.",
        story:[
          ["🌍",ar,"رحلة تمهيدية داخل "+ar+"."]
        ]
      };

    });

    countries=[
      ...baseCountries,
      ...extra
    ];

  }catch(error){

    console.log(
      "Using fallback country database"
    );

  }
}

loadCountries();

/* =========================
   البحث
========================= */

function normalize(text=""){
  return text.toLowerCase().trim();
}

function searchCountries(query){

  query=normalize(query);

  if(!query) return [];

  return countries
    .filter(c=>
      normalize(c.name).includes(query) ||
      normalize(c.english).includes(query)
    )
    .slice(0,12);
}

function showResults(list){

  if(!list.length){
    $("results").style.display="none";
    return;
  }

  $("results").innerHTML=
    list.map(c=>{

      const index=countries.indexOf(c);

      const flag=
        c.flag ||
        `https://flagcdn.com/${c.code}.svg`;

      return`
      <div class="result" data-index="${index}">
        <img src="${flag}" alt="">
        <div>
          <b>${c.name}</b>
          <div class="small">${c.english}</div>
        </div>
      </div>
      `;

    }).join("");

  $("results").style.display="block";
}

$("search").addEventListener(
  "input",
  event=>{
    showResults(
      searchCountries(event.target.value)
    );
  }
);

$("search").addEventListener(
  "keydown",
  event=>{

    if(event.key==="Enter"){

      const country=
        searchCountries(
          $("search").value
        )[0];

      if(country){
        selectCountry(country);
      }
    }
  }
);

$("results").addEventListener(
  "click",
  event=>{

    const row=
      event.target.closest(".result");

    if(!row) return;

    const country=
      countries[
        Number(row.dataset.index)
      ];

    if(country){
      selectCountry(country);
    }
  }
);

/* =========================
   الدولة
========================= */

function selectCountry(country){

  selected=country;

  $("results").style.display="none";

  $("search").value=
    country.name;

  clearMarkers();

  addMarker(
    country.lat,
    country.lon
  );

  flyTo(
    country.lat,
    country.lon
  );

  $("panel").style.display="block";

  $("flag").src=
    country.flag ||
    `https://flagcdn.com/${country.code}.svg`;

  $("name").textContent=
    country.name;

  $("english").textContent=
    country.english;

  $("capital").textContent=
    country.capital;

  $("region").textContent=
    country.region;

  $("population").textContent=
    new Intl.NumberFormat("ar")
    .format(country.population||0);

  $("area").textContent=
    new Intl.NumberFormat("ar")
    .format(country.area||0)
    +" كم²";

  $("language").textContent=
    country.language;

  $("currency").textContent=
    country.currency;

  $("weatherBox").style.display="none";

  openTab("overview");

  xp+=10;

  $("xpCount").textContent=xp;
}

function openTab(tab){

  document.querySelectorAll(".tab")
  .forEach(button=>{

    button.classList.toggle(
      "active",
      button.dataset.tab===tab
    );

  });

  if(!selected) return;

  if(
    tab==="edu" &&
    !requireFeature("edu")
  ){
    return;
  }

  const map={
    overview:selected.overview,
    history:selected.history,
    places:selected.places,
    culture:selected.culture,
    edu:selected.edu
  };

  $("content").textContent=
    map[tab] || "";
}

document.querySelectorAll(".tab")
.forEach(button=>{

  button.addEventListener(
    "click",
    ()=>{
      openTab(
        button.dataset.tab
      );
    }
  );

});

async function showWeather(){

  if(!selected) return;

  $("weatherBox").style.display="block";

  $("temp").textContent=
    "جاري تحميل الطقس...";

  try{

    const url=
    `https://api.open-meteo.com/v1/forecast?latitude=${selected.lat}&longitude=${selected.lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&timezone=auto`;

    const response=
      await fetch(url);

    const data=
      await response.json();

    const current=
      data.current;

    $("temp").textContent=
      Math.round(
        current.temperature_2m
      )+"°C";

    $("weatherText").textContent=
      current.weather_code===0
      ?"سماء صافية ☀️"
      :current.weather_code<=3
      ?"غيوم جزئية 🌤️"
      :current.weather_code<=67
      ?"أمطار 🌧️"
      :"طقس متغير";

    $("wind").textContent=
      "💨 الرياح: "+
      Math.round(
        current.wind_speed_10m
      )+
      " كم/س";

    $("humidity").textContent=
      "💧 الرطوبة: "+
      current.relative_humidity_2m+
      "%";

  }catch(error){

    $("temp").textContent=
      "تعذر تحميل الطقس حالياً.";

    $("weatherText").textContent="";
    $("wind").textContent="";
    $("humidity").textContent="";
  }
}

$("weatherBtn")

);

function yearText(year){

  return year<0
  ?Math.abs(year)+" ق.م"
  :year+" م";
}

function renderTimeline(){

  const year=
    Number(
      $("timeline").value
    );

  $("yearLabel").textContent=
    "السنة: "+
    yearText(year);

  const events=
    historyEvents.filter(
      e=>
      Math.abs(e.year-year)
      <=350
    );

  $("events").innerHTML=
    events.length
    ?events.map(e=>`
      <div
      class="event"
      data-lat="${e.lat}"
      data-lon="${e.lon}">
      <b>
      ${yearText(e.year)}
      —
      ${e.name}
      </b>
      <div class="small">
      ${e.text}
      </div>
      </div>
    `).join("")
    :`
    <div class="event">

========================= */

window.addEventListener(
  "resize",
  ()=>{

    camera.aspect=
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );
  }
);

/* =========================
   الحركة
========================= */

function animate(){

  requestAnimationFrame(
    animate
  );

  if(cameraMove){

    const progress=
      Math.min(
        (
          performance.now()
          -
          cameraMove.start
        )
        /
        cameraMove.duration,
        1
      );

    const smooth=
      progress
      *
      progress
      *
      (
        3
        -
        2
        *
        progress
      );

    camera.position.lerpVectors(
      cameraMove.from,
      cameraMove.to,
      smooth
    );

    camera.lookAt(
      0,
      0,
      0
    );

    if(progress>=1){

      cameraMove=null;
    }
  }

  controls.update();

  renderer.render(
    scene,
    camera
  );
}

animate();
