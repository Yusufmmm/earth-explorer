<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Earth Explorer — مستكشف الأرض والزمن</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#020611;color:#fff;
  font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif
}
button,input{font:inherit}
button{cursor:pointer}
#globe{position:fixed;inset:0}

.glass{
  background:rgba(4,13,30,.88);
  border:1px solid rgba(255,255,255,.16);
  backdrop-filter:blur(14px);
  box-shadow:0 15px 45px rgba(0,0,0,.3)
}

#brand{
  position:fixed;z-index:20;right:16px;top:14px;
  font-weight:900;font-size:19px
}
#brand small{
  display:block;font-size:10px;color:#77d5ff
}

#topbar{
  position:fixed;z-index:25;top:12px;left:50%;
  transform:translateX(-50%);
  width:min(760px,94vw);display:flex;gap:7px
}
#searchWrap{position:relative;flex:1}
#search{
  width:100%;padding:13px 15px;
  border-radius:15px;border:1px solid #ffffff35;
  outline:none;background:#071226e8;color:#fff
}
#results{
  position:absolute;top:51px;left:0;right:0;
  max-height:290px;overflow:auto;border-radius:15px;
  display:none
}
.result{
  display:flex;gap:10px;align-items:center;
  padding:10px 12px;border-bottom:1px solid #ffffff12
}
.result:hover{background:#ffffff12}
.result img{width:34px;height:22px;object-fit:cover;border-radius:3px}
.small{color:#abc3d7;font-size:12px}

.icon{
  border:1px solid #ffffff30;
  border-radius:13px;background:#071226e8;
  color:#fff;padding:10px 13px
}

#modes{
  position:fixed;z-index:22;top:70px;left:50%;
  transform:translateX(-50%);
  border-radius:15px;padding:5px;
  display:flex;gap:4px
}
.mode{
  border:0;background:transparent;color:#cfe5f4;
  padding:8px 11px;border-radius:10px;white-space:nowrap
}
.mode.active{background:#168ed9;color:white}

#countryPanel{
  position:fixed;z-index:30;left:13px;bottom:13px;
  width:min(410px,calc(100vw - 26px));
  max-height:76vh;overflow:auto;
  border-radius:21px;padding:15px;display:none
}
.countryHead{display:flex;align-items:center;gap:11px}
#flag{width:68px;height:45px;object-fit:cover;border-radius:7px}
h2{margin:0;font-size:23px}

.stats{
  display:grid;grid-template-columns:1fr 1fr;
  gap:7px;margin-top:12px
}
.stat{
  padding:9px;border-radius:11px;background:#ffffff0b
}
.stat b{
  display:block;color:#69d2ff;font-size:11px;margin-bottom:3px
}

.tabs{
  display:flex;gap:5px;margin-top:12px;
  overflow-x:auto;padding-bottom:3px
}
.tab{
  border:0;border-radius:9px;padding:8px 10px;
  background:#ffffff0d;color:#d8ebf8;white-space:nowrap
}
.tab.active{background:#168ed9;color:#fff}

.tabContent{
  margin-top:9px;padding:11px;
  background:#ffffff08;border-radius:12px;
  line-height:1.7
}

.actionRow{
  display:flex;gap:6px;margin-top:10px
}
.actionRow button{
  flex:1;border:0;border-radius:10px;
  padding:9px;background:#168ed9;color:white;font-weight:700
}

#weatherBox{
  display:none;margin-top:10px;
  padding:11px;border-radius:12px;
  background:linear-gradient(135deg,#168ed922,#6348e722)
}
#temp{font-size:29px;font-weight:900}

#timelinePanel{
  position:fixed;z-index:29;right:13px;bottom:13px;
  width:min(420px,calc(100vw - 26px));
  max-height:69vh;overflow:auto;
  padding:14px;border-radius:20px;display:none
}
#timelinePanel h3{margin:0 0 10px}
#timeline{width:100%}
#yearLabel{font-weight:900;color:#6bd6ff}

.event{
  margin-top:7px;padding:10px;
  border-radius:11px;background:#ffffff0b
}
.event:hover{background:#ffffff16}

#storyOverlay{
  position:fixed;inset:0;z-index:60;
  display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.78);padding:20px
}
.storyCard{
  width:min(700px,94vw);
  border-radius:24px;padding:24px;
  text-align:center;position:relative;overflow:hidden
}
.storyScene{
  height:230px;border-radius:16px;
  background:
    radial-gradient(circle at 30% 30%,#254b73,#081322 65%);
  display:flex;align-items:center;justify-content:center;
  font-size:82px;margin-bottom:18px
}
.storyScene.animate{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{
  50%{transform:scale(1.025);filter:brightness(1.15)}
}
#storyTitle{font-size:26px;font-weight:900;margin-bottom:7px}
#storyText{line-height:1.8;color:#d8e8f3;min-height:85px}
.storyControls{display:flex;gap:7px;justify-content:center;margin-top:13px}
.storyControls button{
  border:0;border-radius:11px;padding:10px 16px;
  background:#168ed9;color:white;font-weight:700
}
.storyControls .secondary{background:#ffffff18}

#status{
  position:fixed;z-index:26;bottom:13px;left:50%;
  transform:translateX(-50%);
  padding:8px 13px;border-radius:12px;
  background:#071226c9;font-size:12px
}

#loading{
  position:fixed;z-index:100;inset:0;background:#020611;
  display:grid;place-items:center;text-align:center
}
.spinner{
  width:55px;height:55px;border-radius:50%;
  border:6px solid #ffffff20;border-top-color:#35baff;
  animation:spin 1s linear infinite;margin:auto
}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:720px){
  #brand{display:none}
  #topbar{top:8px}
  #modes{
    top:65px;width:94vw;
    overflow-x:auto;justify-content:flex-start
  }
  #status{display:none}
}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>

<script>
const $ = id => document.getElementById(id);

/* ===========================
   3D EARTH
=========================== */

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  45,
  innerWidth / innerHeight,
  .1,
  2000
);

camera.position.set(0,0,3);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));

$("globe").appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = .055;
controls.minDistance = 1.42;
controls.maxDistance = 6;
controls.autoRotate = true;
controls.autoRotateSpeed = .34;

scene.add(new THREE.AmbientLight(0xffffff,.68));

const sun = new THREE.DirectionalLight(0xffffff,1.25);
sun.position.set(4,3,5);
scene.add(sun);

const group = new THREE.Group();
scene.add(group);

const loader = new THREE.TextureLoader();

const earth = new THREE.Mesh(
  new THREE.SphereGeometry(1,64,64),
  new THREE.MeshPhongMaterial({
    map:loader.load(
      "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_atmos_2048.jpg"
    ),
    bumpMap:loader.load(
      "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_normal_2048.jpg"
    ),
    bumpScale:.035,
    specularMap:loader.load(
      "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_specular_2048.jpg"
    ),
    specular:new THREE.Color(0x444444)
  })
);

group.add(earth);

const clouds = new THREE.Mesh(
  new THREE.SphereGeometry(1.009,64,64),
  new THREE.MeshPhongMaterial({
    map:loader.load(
      "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_clouds_1024.png"
    ),
    transparent:true,
    opacity:.36,
    depthWrite:false
  })
);

group.add(clouds);

/* نجوم */

const starArray=[];

for(let i=0;i<1700;i++){
  const r=100+Math.random()*450;
  const a=Math.random()*Math.PI*2;
  const p=Math.acos(2*Math.random()-1);

  starArray.push(
    r*Math.sin(p)*Math.cos(a),
    r*Math.sin(p)*Math.sin(a),
    r*Math.cos(p)
  );
}

const starGeo=new THREE.BufferGeometry();

starGeo.setAttribute(
  "position",
  new THREE.Float32BufferAttribute(starArray,3)
);

scene.add(
  new THREE.Points(
    starGeo,
    new THREE.PointsMaterial({
      color:0xffffff,
      size:.14
    })
  )
);

/* ===========================
   LOCATIONS
=========================== */

const markerGroup=new THREE.Group();
group.add(markerGroup);

function latLon(lat,lon,radius=1.025){

  const phi=(90-lat)*Math.PI/180;
  const theta=(lon+180)*Math.PI/180;

  return new THREE.Vector3(
    -radius*Math.sin(phi)*Math.cos(theta),
    radius*Math.cos(phi),
    radius*Math.sin(phi)*Math.sin(theta)
  );
}

function clearMarkers(){
  while(markerGroup.children.length){
    markerGroup.remove(markerGroup.children[0]);
  }
}

function addMarker(lat,lon,color=0xffd342,size=.022){

  const marker=new THREE.Mesh(
    new THREE.SphereGeometry(size,16,16),
    new THREE.MeshBasicMaterial({color})
  );

  marker.position.copy(latLon(lat,lon));

  markerGroup.add(marker);
}

let cameraMove=null;

function flyTo(lat,lon,distance=2.05){

  controls.autoRotate=false;

  cameraMove={
    from:camera.position.clone(),
    to:latLon(lat,lon,distance),
    start:performance.now(),
    duration:1300
  };
}

let selected=null;

/* ===========================
   SEARCH
=========================== */

function normalize(t=""){
  return t.toLowerCase().trim();
}

function findCountries(q){

  q=normalize(q);

  if(!q)return [];

  return countries.filter(c =>
    normalize(c.name).includes(q) ||
    normalize(c.english).includes(q)
  );
}

function drawResults(list){

  if(!list.length){
    $("results").style.display="none";
    return;
  }

  $("results").innerHTML=list.map(c=>`
    <div class="result" data-name="${c.name}">
      <img src="https://flagcdn.com/${c.code}.svg">
      <div>
        <b>${c.name}</b>
        <div class="small">${c.english}</div>
      </div>
    </div>
  `).join("");

  $("results").style.display="block";
}

$("search").addEventListener("input",e=>{
  drawResults(findCountries(e.target.value));
});

$("search").addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    const result=findCountries($("search").value)[0];
    if(result)selectCountry(result);
  }
});

$("results").addEventListener("click",e=>{
  const row=e.target.closest(".result");
  if(!row)return;

  const c=countries.find(x=>x.name===row.dataset.name);
  selectCountry(c);
});

/* ===========================
   COUNTRY PANEL
=========================== */

function selectCountry(c){

  selected=c;

  $("results").style.display="none";
  $("search").value=c.name;

  clearMarkers();
  addMarker(c.lat,c.lon);
  flyTo(c.lat,c.lon);

  $("countryPanel").style.display="block";

  $("flag").src=`https://flagcdn.com/${c.code}.svg`;
  $("countryName").textContent=c.name;
  $("countryEnglish").textContent=c.english;
  $("capital").textContent=c.capital;
  $("region").textContent=c.region;
  $("population").textContent=
    new Intl.NumberFormat("ar").format(c.population);
  $("area").textContent=
    new Intl.NumberFormat("ar").format(c.area)+" كم²";
  $("language").textContent=c.language;
  $("currency").textContent=c.currency;

  $("weatherBox").style.display="none";

  openTab("overview");

  $("status").textContent="📍 "+c.name;
}

function openTab(tab){

  document.querySelectorAll(".tab").forEach(x=>
    x.classList.toggle("active",x.dataset.tab===tab)
  );

  if(!selected)return;

  const map={
    overview:selected.overview,
    history:selected.history,
    places:selected.places,
    culture:selected.culture
  };

  $("tabContent").textContent=map[tab] || "";
}

document.querySelectorAll(".tab").forEach(btn=>{
  btn.addEventListener("click",()=>openTab(btn.dataset.tab));
});

/* ===========================
   WEATHER
=========================== */

function weatherText(code){
  if(code===0)return "سماء صافية ☀️";
  if(code<=3)return "غيوم جزئية 🌤️";
  if(code<=48)return "ضباب 🌫️";
  if(code<=65)return "مطر 🌧️";
  if(code<=75)return "ثلوج ❄️";
  if(code<=82)return "زخات 🌦️";
  if(code>=95)return "عاصفة رعدية ⛈️";
  return "طقس متغير";
}

async function loadWeather(){

  if(!selected)return;

  $("weatherBox").style.display="block";
  $("temp").textContent="جاري التحميل...";

  try{

    const url=
    `https://api.open-meteo.com/v1/forecast?latitude=${selected.lat}&longitude=${selected.lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=auto`;

    const r=await fetch(url);
    const d=await r.json();
    const w=d.current;

    $("temp").textContent=Math.round(w.temperature_2m)+"°C";
    $("weatherText").textContent=weatherText(w.weather_code);
    $("wind").textContent="💨 الرياح: "+Math.round(w.wind_speed_10m)+" كم/س";
    $("humidity").textContent="💧 الرطوبة: "+w.relative_humidity_2m+"%";

  }catch(e){
    $("temp").textContent="تعذر تحميل الطقس";
  }
}

$("weatherBtn").onclick=loadWeather;

/* ===========================
   SPEECH
=========================== */

$("speakBtn").onclick=()=>{

  if(!selected)return;

  speechSynthesis.cancel();

  const s=new SpeechSynthesisUtterance(
    selected.name+". "+selected.overview
  );

  s.lang="ar";

  speechSynthesis.speak(s);
};

/* ===========================
   INTERACTIVE STORY
=========================== */

let storyIndex=0;

function showStory(){

  if(!selected)return;

  storyIndex=0;
  $("storyOverlay").style.display="flex";

  renderStory();
}

function renderStory(){

  const slide=selected.story[storyIndex];

  $("storyScene").textContent=slide[0];
  $("storyTitle").textContent=slide[1];
  $("storyText").textContent=slide[2];

  $("storyPrev").disabled=storyIndex===0;

  $("storyNext").textContent=
    storyIndex===selected.story.length-1
    ?"إعادة"
    :"التالي";
}

$("storyBtn").onclick=showStory;

$("storyNext").onclick=()=>{

  if(storyIndex===selected.story.length-1){
    storyIndex=0;
  }else{
    storyIndex++;
  }

  renderStory();
};

$("storyPrev").onclick=()=>{
  if(storyIndex>0){
    storyIndex--;
    renderStory();
  }
};

$("storyClose").onclick=()=>{
  $("storyOverlay").style.display="none";
};

function yearName(y){
  return y<0 ? Math.abs(y)+" ق.م" : y+" م";
}

function drawTimeline(){

  const y=Number($("timeline").value);

  $("yearLabel").textContent=yearName(y);

  const matches=historyEvents
    .filter(e=>Math.abs(e.year-y)<=350)
    .sort((a,b)=>Math.abs(a.year-y)-Math.abs(b.year-y));

  $("events").innerHTML=
    matches.length
    ?matches.map(e=>`
      <div class="event" data-lat="${e.lat}" data-lon="${e.lon}">
        <b>${yearName(e.year)} — ${e.name}</b>
        <div class="small">${e.text}</div>
      </div>
    `).join("")
    :`<div class="event">حرّك الخط الزمني لاكتشاف أحداث أخرى.</div>`;
}

$("timeline").oninput=drawTimeline;

$("events").onclick=e=>{

  const item=e.target.closest(".event");

  if(!item)return;

  const lat=Number(item.dataset.lat);
  const lon=Number(item.dataset.lon);

  if(Number.isFinite(lat)&&Number.isFinite(lon)){

    clearMarkers();
    addMarker(lat,lon,0xffa52e);
    flyTo(lat,lon,2.1);
  }
};

/* ===========================
   MODES
=========================== */

document.querySelectorAll(".mode").forEach(btn=>{

  btn.onclick=()=>{

    document.querySelectorAll(".mode").forEach(x=>
      x.classList.remove("active")
    );

    btn.classList.add("active");

    const mode=btn.dataset.mode;

    $("timelinePanel").style.display="none";

    if(mode==="earth"){
      clearMarkers();
      controls.autoRotate=true;
    }

    if(mode==="weather"){
      if(selected)loadWeather();
      else $("status").textContent="اختر دولة أولًا";
    }

    if(mode==="history"){

      $("timelinePanel").style.display="block";
      $("timelineTitle").textContent="🏛️ الحضارات والتاريخ";

      $("timeline").style.display="block";
      $("yearLabel").style.display="inline";
      $("timeline").min=-5000;
      $("timeline").max=2026;
      $("timeline").step=25;
      $("timeline").value=1200;

      drawTimeline();

      clearMarkers();

      historyEvents.forEach(e=>
        addMarker(e.lat,e.lon,0xffa52e,.015)
      );
    }

    if(mode==="dino"){

      $("timelinePanel").style.display="block";
      $("timelineTitle").textContent="🦖 عالم الديناصورات";

      $("timeline").style.display="none";
      $("yearLabel").style.display="none";

      $("events").innerHTML=dinosaurs.map(d=>`
        <div class="event" data-lat="${d[3]}" data-lon="${d[4]}">
          <b>🦖 ${d[0]}</b>
          <div>${d[1]}</div>
          <div class="small">${d[2]}</div>
        </div>
      `).join("");

      clearMarkers();

      dinosaurs.forEach(d=>
        addMarker(d[3],d[4],0xff5050,.017)
      );
    }
  };
});

/* ===========================
   HOME
=========================== */

$("homeBtn").onclick=()=>{

  cameraMove=null;

  camera.position.set(0,0,3);
  controls.target.set(0,0,0);
  controls.autoRotate=true;

  $("countryPanel").style.display="none";
  $("timelinePanel").style.display="none";
  $("search").value="";

  clearMarkers();
};

/* ===========================
   RESIZE
=========================== */

addEventListener("resize",()=>{

  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(innerWidth,innerHeight);
});

/* ===========================
   ANIMATION
=========================== */

function animate(){

  requestAnimationFrame(animate);

  clouds.rotation.y+=.00018;

  if(cameraMove){

    const t=Math.min(
      (performance.now()-cameraMove.start)/
      cameraMove.duration,
      1
    );

    const smooth=t*t*(3-2*t);

    camera.position.lerpVectors(
      cameraMove.from,
      cameraMove.to,
      smooth
    );

    camera.lookAt(0,0,0);

    if(t>=1)cameraMove=null;
  }

  controls.update();

  renderer.render(scene,camera);
}

animate();

setTimeout(()=>{

  $("loading").style.opacity="0";

  setTimeout(()=>{
    $("loading").style.display="none";
  },500);

},1800);

</script>
