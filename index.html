<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<title>مستكشف الأرض والزمن</title>

<style>
*{box-sizing:border-box}
html,body{
margin:0;width:100%;height:100%;overflow:hidden;
background:#020611;color:#fff;
font-family:Arial,Tahoma,sans-serif
}
#globe{position:fixed;inset:0}

.glass{
background:rgba(5,15,35,.86);

#title{

#top{
position:fixed;z-index:20;top:12px;left:50%;

}

#searchWrap{flex:1;position:relative}

#search{
width:100%;padding:13px 15px;
border-radius:15px;border:1px solid #ffffff44;
background:#071126ee;color:white;
outline:none;font-size:15px
}

#results{
position:absolute;top:52px;left:0;right:0;
max-height:300px;overflow:auto;
border-radius:14px;display:none
}

.result{
padding:10px;cursor:pointer;
border-bottom:1px solid #ffffff16;
display:flex;gap:10px;align-items:center
}

.result:hover{background:#ffffff16}

.result img{
width:32px;height:21px;
object-fit:cover;border-radius:3px
}

.icon{
border:1px solid #ffffff33;
background:#071126ee;color:white;
border-radius:13px;padding:11px;
cursor:pointer
}

#modes{
position:fixed;z-index:18;
top:70px;left:50%;
transform:translateX(-50%);
display:flex;gap:5px;padding:6px;
border-radius:15px
}

.mode{
border:0;background:transparent;
color:#d5ebf8;padding:8px 11px;
border-radius:10px;cursor:pointer
}

.mode.active{
background:#168ed9;color:white
}

#info{
position:fixed;z-index:25;
left:14px;bottom:14px;
width:min(390px,calc(100% - 28px));
max-height:72vh;overflow:auto;
padding:15px;border-radius:20px;
display:none
}

.head{
display:flex;align-items:center;gap:11px
}

#flag{
width:67px;height:44px;
object-fit:cover;border-radius:6px
}

h2{margin:0}
.small{font-size:12px;color:#afc8d9}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;margin-top:12px
}

.card{
padding:9px;border-radius:11px;
background:#ffffff0c
}

.card b{
display:block;
font-size:11px;
color:#6ed4ff;
margin-bottom:3px
}

.actions{
display:flex;gap:6px;margin-top:11px
}

.actions button{
flex:1;border:0;
background:#168ed9;color:white;
border-radius:10px;padding:9px;
cursor:pointer
}

#weather{
display:none;
margin-top:11px;
padding:11px;
border-radius:12px;
background:#168ed922
}

#temp{
font-size:28px;
font-weight:bold
}

#history{
position:fixed;z-index:24;
right:14px;bottom:14px;
width:min(420px,calc(100% - 28px));
max-height:65vh;overflow:auto;
padding:14px;border-radius:20px;
display:none
}

#history h3{margin:0 0 10px}

#timeline{
width:100%
}

#yearText{
color:#68d4ff;font-weight:bold
}

.event{
padding:10px;margin-top:7px;
border-radius:11px;
background:#ffffff0c;
cursor:pointer
}

.event:hover{background:#ffffff18}

#status{
position:fixed;z-index:30;
left:50%;bottom:15px;
transform:translateX(-50%);
padding:8px 13px;
border-radius:12px;
background:#071126dd;
font-size:12px
}

#loading{
position:fixed;inset:0;z-index:100;
display:flex;align-items:center;justify-content:center;
background:#020611;
transition:.5s
}

.spinner{
width:55px;height:55px;
border-radius:50%;
border:6px solid #ffffff20;
border-top-color:#34baff;
animation:spin 1s linear infinite;
margin:auto
}

@keyframes spin{
to{transform:rotate(360deg)}
}

@media(max-width:700px){
#title{display:none}
#modes{
width:95%;overflow-x:auto;
justify-content:flex-start
}
.mode{white-space:nowrap}
}

<script>

/* =========================
   إعداد المشهد
========================= */

const $=x=>document.getElementById(x);

const scene=new THREE.Scene();

const camera=
new THREE.PerspectiveCamera(
45,
innerWidth/innerHeight,
.1,
2000
);

camera.position.set(0,0,3);

const renderer=
new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(
innerWidth,
innerHeight
);

renderer.setPixelRatio(
Math.min(devicePixelRatio,2)
);

$("globe").appendChild(
renderer.domElement
);

const controls=
new THREE.OrbitControls(
camera,
renderer.domElement
);

controls.enableDamping=true;
controls.dampingFactor=.055;

controls.minDistance=1.4;
controls.maxDistance=6;

controls.autoRotate=true;
controls.autoRotateSpeed=.35;

/* =========================
   إضاءة
========================= */

scene.add(
new THREE.AmbientLight(
0xffffff,
.65
)
);

const sun=
new THREE.DirectionalLight(
0xffffff,
1.25
);

sun.position.set(
4,3,5
);

scene.add(sun);

/* =========================
   الأرض
========================= */

const earthGroup=
new THREE.Group();

scene.add(
earthGroup
);

const loader=
new THREE.TextureLoader();

const earthMap=
loader.load(
"https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_atmos_2048.jpg"
);

const normalMap=
loader.load(
"https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_normal_2048.jpg"
);

const specularMap=
loader.load(
"https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_specular_2048.jpg"
);

const earth=
new THREE.Mesh(

new THREE.SphereGeometry(
1,64,64
),

new THREE.MeshPhongMaterial({

map:earthMap,

bumpMap:normalMap,

bumpScale:.035,

specularMap:specularMap,

specular:new THREE.Color(
0x555555
)

})

);

earthGroup.add(
earth
);

/* =========================
   الغيوم
========================= */

const cloudMap=
loader.load(
"https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_clouds_1024.png"
);

const clouds=
new THREE.Mesh(

new THREE.SphereGeometry(
1.008,64,64
),

new THREE.MeshPhongMaterial({

map:cloudMap,

transparent:true,

opacity:.38,

depthWrite:false

})

);

earthGroup.add(
clouds
);

/* =========================
   النجوم
========================= */

const starPositions=[];

for(let i=0;i<1800;i++){

const r=
100+Math.random()*500;

const a=
Math.random()*Math.PI*2;

const p=
Math.acos(
2*Math.random()-1
);

starPositions.push(

r*Math.sin(p)*Math.cos(a),

r*Math.sin(p)*Math.sin(a),

r*Math.cos(p)

);

}

const starGeo=
new THREE.BufferGeometry();

starGeo.setAttribute(

"position",

new THREE.Float32BufferAttribute(
starPositions,
3
)

);

scene.add(

new THREE.Points(

starGeo,

new THREE.PointsMaterial({

color:0xffffff,

size:.15

})

)

);

/* =========================
   نقاط المواقع
========================= */

const markerGroup=
new THREE.Group();

earthGroup.add(
markerGroup
);

function vectorFromLatLon(
lat,
lon,
radius=1.025
){

const phi=
(90-lat)*
Math.PI/180;

const theta=
(lon+180)*
Math.PI/180;

return new THREE.Vector3(

-radius*
Math.sin(phi)*
Math.cos(theta),

radius*
Math.cos(phi),

radius*
Math.sin(phi)*
Math.sin(theta)

);

}

function clearMarkers(){

while(
markerGroup.children.length
){

markerGroup.remove(
markerGroup.children[0]
);

}

}

function addMarker(
lat,
lon,
color=0xffd84a
){

const marker=
new THREE.Mesh(

new THREE.SphereGeometry(
.022,
16,
16
),

new THREE.MeshBasicMaterial({
color
})

);

marker.position.copy(
vectorFromLatLon(
lat,
lon
)
);

markerGroup.add(
marker
);

}

/* =========================
   حركة الكاميرا
========================= */

let cameraMove=null;

function goTo(
lat,
lon,
distance=2.05
){

controls.autoRotate=false;

cameraMove={

from:
camera.position.clone(),

to:
vectorFromLatLon(
lat,
lon,
distance
),

start:
performance.now(),

duration:
1200

};

}

/* =========================
   قاعدة احتياطية للدول
   تعمل حتى لو فشل الإنترنت
========================= */

const fallbackCountries=[

},

},

{

},

{

let countries=[
...fallbackCountries
];

let selected=null;

/* =========================
   محاولة تحميل كل دول العالم
========================= */

async function loadAllCountries(){

try{

const response=
await fetch(
"https://restcountries.com/v3.1/all?fields=name,translations,cca2,capital,region,population,area,languages,currencies,flags,latlng"
);

if(!response.ok)
throw new Error();

const data=
await response.json();

const parsed=
data
.filter(c=>c.latlng?.length>=2)
.map(c=>({

name:
c.translations?.ara?.common ||
c.name.common,

english:
c.name.common,

capital:
c.capital?.[0] || "—",

lat:
c.latlng[0],

lon:
c.latlng[1],

region:
c.region || "—",

population:
c.population || 0,

area:
c.area || 0,

languages:
Object.values(
c.languages || {}
).join("، ") || "—",

currency:
Object.values(
c.currencies || {}
).map(x=>
x.name
).join("، ") || "—",

flag:
c.flags?.svg ||
c.flags?.png,

code:
c.cca2?.toLowerCase()

}));

countries=parsed;

$("status").textContent=
"✅ تم تحميل دول العالم";

}catch(error){

$("status").textContent=
"⚠️ تعمل النسخة الاحتياطية للدول";

}

}

loadAllCountries();

/* =========================
   البحث
========================= */

function normalize(
text=""
){

return text
.toLowerCase()
.trim();

}

function findCountries(
query
){

const q=
normalize(query);

if(!q)
return [];

return countries
.filter(c=>

normalize(
c.name
).includes(q)

||

normalize(
c.english
).includes(q)

)
.slice(0,12);

}

function drawResults(
list
){

if(!list.length){

$("results").style.display=
"none";

return;

}

$("results").innerHTML=
list.map(
(c,i)=>{

const index=
countries.indexOf(c);

const flag=
c.flag ||
`https://flagcdn.com/${c.code}.svg`;

return`

<div class="result"
data-index="${index}">

<img src="${flag}">

<div>

<b>${c.name}</b>

<div class="small">
${c.english}
</div>

</div>

</div>

`;

}).join("");

$("results").style.display=
"block";

}

$("search").oninput=e=>{

drawResults(
findCountries(
e.target.value
)
);

};

$("search").onkeydown=e=>{

if(
e.key==="Enter"
){

const found=
findCountries(
$("search").value
);

if(found.length)
selectCountry(
found[0]
);

}

};

$("results").onclick=e=>{

const item=
e.target.closest(
".result"
);

if(!item)
return;

selectCountry(
countries[
Number(
item.dataset.index
)
]
);

};

/* =========================
   اختيار دولة
========================= */

function selectCountry(c){

selected=c;

$("search").value=
c.name;

$("results").style.display=
"none";

clearMarkers();

addMarker(
c.lat,
c.lon
);

goTo(
c.lat,
c.lon
);

$("info").style.display=
"block";

$("name").textContent=
c.name;

$("official").textContent=
c.english;

$("capital").textContent=
c.capital;

$("region").textContent=
c.region;

$("population").textContent=
new Intl.NumberFormat(
"ar"
).format(
c.population
);

$("area").textContent=
new Intl.NumberFormat(
"ar"
).format(
c.area
)+" كم²";

$("languages").textContent=
c.languages;

$("currency").textContent=
c.currency;

$("flag").src=
c.flag ||
`https://flagcdn.com/${c.code}.svg`;

$("weather").style.display=
"none";

$("status").textContent=
"📍 "+c.name;

}

/* =========================
   الطقس المباشر
========================= */

function weatherName(
code
){

if(code===0)
return "سماء صافية ☀️";

if(code<=3)
return "غيوم جزئية 🌤️";

if(code<=48)
return "ضباب 🌫️";

if(code<=55)
return "رذاذ 🌦️";

if(code<=65)
return "مطر 🌧️";

if(code<=75)
return "ثلوج ❄️";

if(code<=82)
return "زخات مطر 🌧️";

if(code>=95)
return "عاصفة رعدية ⛈️";

return "طقس متغير";

}

async function getWeather(){

if(!selected){

$("status").textContent=
"اختر دولة أولًا";

return;

}

$("weather").style.display=
"block";

$("temp").textContent=
"جاري التحميل...";

try{

const url=

`https://api.open-meteo.com/v1/forecast?latitude=${selected.lat}&longitude=${selected.lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=auto`;

const response=
await fetch(url);

const data=
await response.json();

const w=
data.current;

$("temp").textContent=
Math.round(
w.temperature_2m
)+"°C";

$("weatherText").textContent=
weatherName(
w.weather_code
);

$("wind").textContent=
"💨 الرياح: "+
Math.round(
w.wind_speed_10m
)+" كم/س";

$("humidity").textContent=
"💧 الرطوبة: "+
w.relative_humidity_2m+
"%";

}catch(error){

$("temp").textContent=
"تعذر تحميل الطقس";

}

}

$("weatherButton").onclick=
getWeather;

   الصوت
========================= */

$("speak").onclick=()=>{

if(!selected)
return;

speechSynthesis.cancel();

const speech=
new SpeechSynthesisUtterance(

/* =========================
   عرض التاريخ
========================= */

function yearName(
year
){

return year<0
?
Math.abs(year)+
" ق.م"

:
year+" م";

}

function drawHistory(){

const year=
Number(
$("timeline").value
);

$("yearText").textContent=
yearName(
year
);

const events=
historyEvents
.filter(e=>
Math.abs(
e.year-year
)<400
)
.sort(
(a,b)=>
Math.abs(a.year-year)-
Math.abs(b.year-year)
);

$("events").innerHTML=

events.length

?

events.map(
(e,i)=>`

<div class="event"
data-lat="${e.lat}"
data-lon="${e.lon}">

<b>
${yearName(e.year)}
—
${e.name}
</b>

<div class="small">
${e.text}
</div>

</div>

`
).join("")

:

`<div class="event">
لا توجد أحداث مضافة لهذه الفترة بعد.
</div>`;

}

$("timeline").oninput=
drawHistory;

$("events").onclick=e=>{

const item=
e.target.closest(
".event"
);

if(!item)
return;

const lat=
Number(
item.dataset.lat
);

const lon=
Number(
item.dataset.lon
);

if(
Number.isFinite(lat)
&&
Number.isFinite(lon)
){

clearMarkers();

addMarker(
lat,
lon,
0xffa62e
);

goTo(
lat,
lon
);

}

};

/* =========================
   تغيير حجم الشاشة
========================= */

addEventListener(
"resize",
()=>{

camera.aspect=
innerWidth/
innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
innerWidth,
innerHeight
);

}
);

/* =========================
   الحركة
========================= */

function animate(){

requestAnimationFrame(
animate
);

clouds.rotation.y+=
.00018;

if(cameraMove){

const t=
Math.min(

(
performance.now()-
cameraMove.start
)
/
cameraMove.duration,

1

);

const smooth=
t*t*(3-2*t);

camera.position.lerpVectors(

cameraMove.from,

cameraMove.to,

smooth

);

camera.lookAt(
0,0,0
);

if(t>=1)
cameraMove=null;

}

controls.update();

renderer.render(
scene,
camera
);

}

animate();
